services:
  - type: web
    name: kitobxonlar-quiz-v29
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kitobxonlar-quiz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kitobxonlar-quiz-cache
          property: connectionString
      - key: TARGET_CHANNEL_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: APP_NAME
        value: Kitobxonlar Quiz V29
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.13.5

  - type: keyvalue
    name: kitobxonlar-quiz-cache
    plan: free


# Postgres is defined separately because Render Blueprints require databases in `databases:`.
databases:
  - name: kitobxonlar-quiz-db
    plan: free
